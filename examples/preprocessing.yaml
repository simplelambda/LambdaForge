# Runnable concise preprocessing; replace builtins.dict with project logic as needed.
name: jsonl-preprocessing
output_root: ../runs/tasks
inputs:
  raw: preprocessing-input.jsonl
outputs:
  processed: processed
preprocess:
  function: builtins.dict
  input: raw
  output: processed
  key_field: id
  workers: 2
  workload: io
  checkpoint_interval: 1
  publish_dataset: true
  dataset_name: example-records
  dataset_version: "1"
resources:
  cpus: 2
  memory: 1GiB
  time: 5m
