name: complete-study
resources:
  cpu: 4
steps:
  - name: prepare
    run: lambdaforge.examples.prepare
    with:
      source:
        file: preprocessing-input.jsonl
  - parallel:
      - name: model-a
        run: lambdaforge.examples.train_a
        resources: {gpu: 1, cpu: 4}
      - name: model-b
        run: lambdaforge.examples.train_b
        resources: {gpu: 1, cpu: 4}
  - name: compare
    run: lambdaforge.examples.compare
