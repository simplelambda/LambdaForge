schema_version: "1.1"

experiment:
  name: example_mlp
  output_root: runs/experiments
  seeds: [7, 17, 27]
  resume: true
  rerun_completed: false
  test_after_fit: true
  required_artifacts: []

data:
  # A reusable package may replace target/params with:
  # plugin: {kind: dataset, name: acme_records}
  train:
    target: your_project.data.TrainDataset
    params: {}
  val:
    target: your_project.data.ValidationDataset
    params: {}
  test:
    target: your_project.data.TestDataset
    params: {}
  datamodule:
    target: lambdaforge.training.data.LightningDataModule
    params:
      batch_size: 64
      num_workers: 4
      persistent_workers: true
      collate_fn:
        ref: your_project.data.collate_batch

model:
  target: lambdaforge.nn.models.MLP
  params:
    in_features: 32
    out_features: 1
    hidden: [128, 64]
    activation: gelu
    normalization: layernorm
    dropout: 0.1

losses:
  - target: lambdaforge.nn.losses.BinaryCrossEntropyWithLogitsLoss
    params:
      output_key: logits
      target_key: target

train_metrics: []
val_metrics:
  - target: lambdaforge.metrics.classification.BinaryAUROC
    params:
      pred_key: logits
      target_key: target
test_metrics:
  - target: lambdaforge.metrics.classification.BinaryAUROC
    params:
      pred_key: logits
      target_key: target

optimizer:
  ref: torch.optim.AdamW
  params:
    lr: 0.001
    weight_decay: 0.0001

task:
  target: lambdaforge.training.LightningTask
  params:
    model_input_key: x
    model_output_key: logits
    logging:
      log_total_loss: true
      log_individual_losses: true
      loss_on_step: true
      loss_on_epoch: true
      metric_prog_bar: true
      logger: false  # Set true when enabling an external/provider logger.

trainer:
  max_epochs: 50
  accelerator: auto
  devices: auto
  precision: 32-true
  checkpoint_policy: last_and_best
  checkpoint_monitor: val_auroc
  checkpoint_mode: max
  early_stopping_patience: 8
  early_stopping_monitor: val_auroc
  early_stopping_mode: max
  # Also accepts one logger plugin or a list mixing target/ref/plugin objects.
  # Optional provider example (requires `lambdaforge[tensorboard]`):
  # logger:
  #   target: lambdaforge.tracking.TensorBoardTrackingLogger
  #   params: {save_dir: ./tracking/tensorboard, name: example_mlp}
  logger: csv
  write_epoch_metrics_csv: true
  epoch_metrics_include: ["train_*", "val_*", "test_*"]
  epoch_metrics_exclude: ["*_step"]
  trainer_kwargs:
    enable_model_summary: true

# Each item may use target/params or plugin: {kind: callback, name: ...}.
callbacks: []

sweep:
  include_base: true
  grid:
    model.params.hidden: [[128, 64], [256, 128]]
    optimizer.params.lr: [0.001, 0.0003]
  ablations:
    - name: no_dropout
      set:
        model.params.dropout: 0.0

# Statistical comparisons are paired by seed. Positive "improvement" always means
# the variant is better, including metrics whose mode is "min".
aggregation:
  comparisons:
    alpha: 0.05
    target_power: 0.80
    min_pairs_for_verdict: 3
    confidence_interval:
      method: bootstrap_percentile  # normal (legacy default) or bootstrap_percentile
      confidence_level: 0.95
      resamples: 10000
      seed: 0
      batch_size: 1024
      max_batch_elements: 1000000
    paired_test:
      method: wilcoxon              # sign (legacy default) or wilcoxon
      alternative: two_sided
      calculation: auto             # exact, asymptotic or bounded auto selection
      zero_method: wilcox            # wilcox, pratt or zsplit
      continuity_correction: false
      exact_max_pairs: 50
      zero_tolerance: 1.0e-12
      round_decimals: 12

# Preview is strictly read-only. Change mode to apply, or use
# `lambdaforge retain ... --apply`, only after reviewing the generated plan.
retention:
  mode: preview
  checkpoints:
    keep: last_and_best
    prune_unselected: true
  protect:
    - "reports/**"
    - "predictions/final.json"
  rules:
    - action: compress
      include: ["artifacts/intermediate/**"]
      exclude: ["artifacts/intermediate/README.md"]
      min_size_bytes: 1048576
      compression:
        only_if_smaller: true
    - action: prune
      include: ["scratch/**"]
      exclude: []
      min_size_bytes: 0
  archive:
    name: artifacts.zip
    compression_level: 6
  lock_timeout_seconds: 60

execution:
  mode: sequential
  gpus: [0, 1]
  jobs_per_gpu: 2
  devices_per_job: 1
  grace_seconds: 15
  cpu_threads_per_job: 2
  cpu_interop_threads_per_job: 1
  cpu_cores_per_job: 2
  dataloader_num_workers_per_job: 2
