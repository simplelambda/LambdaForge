# Canonical multi-seed training. Python owns model/loss/optimizer choices.
name: example-mlp
run: lambdaforge.examples.train
with:
  dataset:
    file: preprocessing-input.jsonl
  hidden_dim: 128
  dropout: 0.1
seeds: [7, 17, 27]
objective:
  metric: val_auroc
  mode: max
resources:
  gpu: 1
  cpu: 4
  memory: 8GiB
