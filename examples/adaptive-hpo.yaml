# Function-first parameter study using LambdaForge's reproducible search sampler.
name: example-mlp-hpo
run: lambdaforge.examples.train
with:
  dataset:
    file: preprocessing-input.jsonl
search:
  hidden_dim:
    values: [64, 128, 256]
  dropout:
    range: [0.0, 0.5]
trials: 12
objective:
  metric: val_auroc
  mode: max
resources:
  gpu: 1
  cpu: 4
