name: search-visual
run: visual_research.TrainSamples
with:
  dataset: {dataset: visual-demo@1}
  epochs: 2
search:
  budget: {candidates: 4, runs: 8}
  space:
    activation: [relu, tanh]
    use_context: [true, false]
  replication: {minimum: 1, confirmation: []}
objective: {metric: val_loss, mode: min}
resources: {cpu: 1}
execution: {max_parallel: 1}
