# Copy this file to the consumer project and replace the illustrative values.
clusters:
  atlas:
    transport: ssh
    host: atlas-login
    user: USER
    port: 22
    auth: {mode: openssh}
    scheduler: slurm
    workspace: /scratch/USER/lambdaforge
    python: python3
    environment: managed
    pytorch: {channel: auto, require_cuda: auto}
    project_module: my_project
    data_environment: atlas
    resource_mapping:
      gpu: {option: gres, value: "gpu:{gpus}"}
      memory: {option: mem, value: "{memory_gib}G"}
    scheduler_directives:
      partition: gpu
      account: PROJECT
    scheduler_commands:
      submit:
        command: sbatch
        args: [--parsable, "{script}"]
        job_id_pattern: "^(\\d+)(?:;.*)?$"
      queue: {command: squeue, args: [-h, -j, "{job_id}", -o, "%T"]}
      accounting: {command: sacct, args: [-n, -X, -j, "{job_id}", -o, State]}
      cancel: {command: scancel, args: ["{job_id}"]}
    job_script:
      shell: /bin/bash
      prologue: [module load cuda]
      epilogue: []
profiles:
  one-gpu:
    cluster: atlas
    resources:
      cpus: 8
      memory: 32GiB
      gpus: 1
      gpu_memory: 20GiB
      time: 4h
