[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdaforge"
dynamic = ["version"]
description = "Managed scientific Work runtime for reproducible local and cluster research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SimpleLambda" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lightning>=2.2,<3",
    "jsonschema>=4.21",
    "numpy>=1.24,<2.5",
    "packaging>=23",
    "psutil>=5.9",
    "PyYAML>=6",
    "threadpoolctl>=3.2",
    "textual>=8.2,<9",
    "tomli>=2",
    "torch>=2.1",
    "torchmetrics>=1.2",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
mlflow = [
    "mlflow>=2.10",
]
tensorboard = [
    "tensorboard>=2.14",
]
wandb = [
    "wandb>=0.16",
]
tracking = [
    "mlflow>=2.10",
    "tensorboard>=2.14",
    "wandb>=0.16",
]
s3 = [
    "boto3>=1.34",
]
cluster-password = [
    "keyring>=25",
    "paramiko>=3.4",
]
clustering = [
    "scikit-learn>=1.3,<2",
]
adaptive-hpo = [
    "botorch>=0.17,<1",
]
analysis-report = [
    "plotly>=7,<8",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "scikit-learn>=1.3,<2",
    "types-psutil>=7",
    "types-pywin32>=308",
    "types-jsonschema>=4.23",
    "types-PyYAML>=6",
    "twine>=6",
]

[project.scripts]
lambdaforge = "lambdaforge.cli.CommandLineInterface:CommandLineInterface.main"
lf = "lambdaforge.cli.CommandLineInterface:CommandLineInterface.main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lambdaforge._version.VERSION" }

[tool.setuptools.package-data]
lambdaforge = [
    "schemas/*.json",
    "tui/*.tcss",
]

[tool.setuptools.data-files]
"share/lambdaforge" = [
    "AGENTS.md",
    "AGENTS.es.md",
    "CHANGELOG.md",
    "CHANGELOG.es.md",
    "README.md",
    "README.es.md",
    "SECURITY.md",
    "SECURITY.es.md",
]
"share/lambdaforge/examples" = [
    "examples/clustering.py",
    "examples/lambdaforge.clusters.yaml",
    "examples/input.txt",
    "examples/work.py",
    "examples/work.yaml",
    "examples/sequence.yaml",
    "examples/search.yaml",
]
"share/lambdaforge/docs" = [
    "docs/MANUAL.md",
    "docs/MANUAL.es.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "cuda: requires a working CUDA device and exercises accelerator-specific integration",
    "process_integration: real OS signal and process-tree lifecycle tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["lambdaforge"]
explicit_package_bases = true
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "keyring",
    "psutil",
    "sklearn.*",
    "threadpoolctl",
    "jsonschema",
    "plotly.*",
    "win32api",
    "win32con",
    "win32job",
]
ignore_missing_imports = true
