[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdaforge"
version = "0.1.0"
description = "Object-oriented infrastructure for reproducible PyTorch training and YAML experiments."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SimpleLambda" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lightning>=2.2,<3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "psutil>=5.9",
    "PyYAML>=6",
    "threadpoolctl>=3.2",
    "torch>=2.1",
    "torchmetrics>=1.2",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "types-psutil>=7",
    "types-pywin32>=308",
]

[project.scripts]
lambdaforge = "lambdaforge.cli.CommandLineInterface:CommandLineInterface.main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["lambdaforge"]
explicit_package_bases = true
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["psutil", "sklearn.*", "threadpoolctl", "win32api", "win32con", "win32job"]
ignore_missing_imports = true
