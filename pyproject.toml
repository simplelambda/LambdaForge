[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdaforge"
dynamic = ["version"]
description = "Managed scientific Work runtime for reproducible local and cluster research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SimpleLambda" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lightning>=2.2,<3",
    "jsonschema>=4.21",
    "numpy>=2.2.1,<2.5",
    "packaging>=23",
    "psutil>=5.9",
    "PyYAML>=6",
    "threadpoolctl>=3.2",
    "textual>=8.2,<9",
    "textual-plot>=0.10.1,<0.11",
    "tomli>=2",
    "torch>=2.3",
    "torchmetrics>=1.2",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
sql-postgresql = ["psycopg[binary]>=3.2,<4"]
estimators = ["scikit-learn>=1.3,<2"]
estimator-persistence = ["scikit-learn>=1.3,<2", "skops>=0.10,<1"]
graph-directional = [
    "scipy>=1.11,<2",
]
agents = [
    "mcp>=2.3,<2.4",
]
mlflow = [
    "mlflow>=2.10",
]
tensorboard = [
    "tensorboard>=2.14",
]
wandb = [
    "wandb>=0.16",
]
tracking = [
    "mlflow>=2.10",
    "tensorboard>=2.14",
    "wandb>=0.16",
]
s3 = [
    "boto3>=1.34",
]
cluster-password = [
    "keyring>=25",
    "paramiko>=3.4",
]
clustering = [
    "scikit-learn>=1.3,<2",
]
optimal-transport = [
    "POT>=0.9.6,<0.10",
]
adaptive-hpo = [
    "botorch>=0.17,<1",
]
analysis-report = [
    "plotly>=7,<8",
]
gpu-observation = [
    "nvidia-ml-py>=12.535,<14",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "scikit-learn>=1.3,<2",
    "types-psutil>=7",
    "types-pywin32>=308",
    "types-jsonschema>=4.23",
    "types-PyYAML>=6",
    "twine>=6",
]

[project.scripts]
lambdaforge = "lambdaforge.cli.CommandLineInterface:CommandLineInterface.main"
lf = "lambdaforge.cli.CommandLineInterface:CommandLineInterface.main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lambdaforge._version.VERSION" }

[tool.setuptools.package-data]
lambdaforge = [
    "catalog/*.json",
    "agents/assets/consumer/*.md",
    "agents/assets/examples/*.md",
    "agents/assets/examples/*.py",
    "agents/assets/examples/*.yaml",
    "agents/assets/skills/*/SKILL.md",
    "agents/assets/skills/*/references/*.md",
    "analysis/assets/*.js",
    "schemas/*.json",
    "tui/*.tcss",
]

[tool.setuptools.data-files]
"share/lambdaforge" = [
    "AGENTS.md",
    "AGENTS.es.md",
    "CHANGELOG.md",
    "CHANGELOG.es.md",
    "README.md",
    "README.es.md",
    "SECURITY.md",
    "SECURITY.es.md",
]
"share/lambdaforge/examples" = [
    "examples/isolated_tools.toml",
    "examples/table-schema.json",
    "examples/table-preview.json",
    "examples/tabular_preview.py",
    "examples/tabular_preview.yaml",
    "examples/visual_research.py",
    "examples/visual_prepare.yaml",
    "examples/visual_train.yaml",
    "examples/visual_search.yaml",
    "examples/sample-schema.json",
    "examples/graph_encoders.py",
    "examples/graph_operator_controls.py",
    "examples/agent_gui.py",
    "examples/clustering.py",
    "examples/fgw.py",
    "examples/lambdaforge.clusters.yaml",
    "examples/input.txt",
    "examples/work.py",
    "examples/managed_report.py",
    "examples/work.yaml",
    "examples/sequence.yaml",
    "examples/search.yaml",
    "examples/conditional-sweep.yaml",
    "examples/monitor.json",
]
"share/lambdaforge/docs" = [
    "docs/MANUAL.md",
    "docs/MANUAL.es.md",
]
"share/lambdaforge/docs/ai" = [
    "docs/ai/IMPLEMENTATION.md",
    "docs/ai/IMPLEMENTATION.es.md",
    "docs/ai/FRAMEWORK_CONTRACTS.md",
    "docs/ai/AGENT_GUIDE.es.md",
]
"share/lambdaforge/examples/work_results" = [
    "examples/work_results/README.md",
    "examples/work_results/pyproject.toml",
    "examples/work_results/train.yaml",
    "examples/work_results/visualize.yaml",
    "examples/work_results/demo.py",
]
"share/lambdaforge/examples/work_results/work_results_example" = [
    "examples/work_results/work_results_example/__init__.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "cuda: requires a working CUDA device and exercises accelerator-specific integration",
    "process_integration: real OS signal and process-tree lifecycle tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["lambdaforge"]
explicit_package_bases = true
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "keyring",
    "mcp.*",
    "pydantic",
    "starlette.*",
    "uvicorn",
    "psutil",
    "sklearn.*",
    "scipy.*",
    "ot.*",
    "threadpoolctl",
    "jsonschema",
    "jsonschema.*",
    "plotly.*",
    "textual_plot.*",
    "win32api",
    "win32con",
    "win32job",
]
ignore_missing_imports = true
