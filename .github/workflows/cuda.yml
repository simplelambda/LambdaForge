name: CUDA smoke (manual)
run-name: CUDA smoke / CPython ${{ inputs.python-version }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Stable CPython version available to setup-python
        required: true
        default: "3.13"
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  cuda-smoke:
    name: Self-hosted Linux CUDA / CPython ${{ inputs.python-version }}
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Require a real CUDA device and record evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import torch

          if not torch.cuda.is_available():
              raise SystemExit(
                  "CUDA workflow requires torch.cuda.is_available() == True; "
                  "this runner provides no usable CUDA device."
              )
          properties = torch.cuda.get_device_properties(0)
          evidence = {
              "torch_version": torch.__version__,
              "torch_cuda_runtime": torch.version.cuda,
              "cudnn_version": torch.backends.cudnn.version(),
              "device_count": torch.cuda.device_count(),
              "device_name": properties.name,
              "compute_capability": [properties.major, properties.minor],
          }
          Path("cuda-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Run tests explicitly marked for CUDA
        run: >-
          python -m pytest -q --strict-markers -m cuda
          --durations=20 --junitxml=cuda-junit.xml

      - name: Run non-CUDA regression suite
        run: >-
          python -m pytest -q --strict-markers -m "not cuda"
          --durations=20 --junitxml=regression-junit.xml

      - name: Upload CUDA evidence and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cuda-evidence-py${{ inputs.python-version }}-${{ github.run_id }}
          path: |
            cuda-evidence.json
            cuda-junit.xml
            regression-junit.xml
          if-no-files-found: warn
          retention-days: 14
